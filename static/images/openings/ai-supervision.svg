<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Human-guided evaluation of generative AI</title>
<desc id="desc">Experts specify requirements and answer targeted queries. A probabilistic evaluator guides realistic scenario generation, tests AI systems, and uses risk evidence to refine the next evaluation.</desc>
<defs>
<marker id="navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#235480"/></marker>
<marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#208b8b"/></marker>
<marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#bb7d1f"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17334c}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:17px}.small{font-size:16px;fill:#526779}.navy{fill:none;stroke:#235480;stroke-width:2.5;marker-end:url(#navy)}.teal{fill:none;stroke:#208b8b;stroke-width:2.5;marker-end:url(#teal)}.query{fill:none;stroke:#bb7d1f;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#amber)}</style>
</defs>
<rect width="1200" height="780" rx="18" fill="#fff"/>
<text x="40" y="44" class="title">Human-guided evaluation of generative AI</text>
<rect x="40" y="145" width="270" height="170" rx="15" fill="#edf3f9" stroke="#235480" stroke-width="1.8"/>
<text x="175" y="183" class="heading" text-anchor="middle">Human experts</text>
<text x="175" y="217" class="label" text-anchor="middle">Requirements and context</text>
<text x="175" y="248" class="label" text-anchor="middle">Desired and undesired</text>
<text x="175" y="274" class="label" text-anchor="middle">behaviors</text>
<rect x="440" y="145" width="340" height="170" rx="15" fill="#eaf6f5" stroke="#208b8b" stroke-width="1.8"/>
<text x="610" y="184" class="heading" text-anchor="middle">Probabilistic evaluator</text>
<text x="610" y="219" class="label" text-anchor="middle">Select informative tests</text>
<text x="610" y="248" class="label" text-anchor="middle">Prioritize expert queries</text>
<text x="610" y="277" class="small" text-anchor="middle">Limited human and compute budget</text>
<path d="M310 210H438" class="teal"/>
<text x="375" y="193" class="small" text-anchor="middle">Feedback</text>
<path d="M440 274H312" class="query"/>
<text x="375" y="299" class="small" text-anchor="middle">Queries</text>
<rect x="900" y="145" width="260" height="170" rx="15" fill="#edf3f9" stroke="#235480" stroke-width="1.8"/>
<text x="1030" y="184" class="heading" text-anchor="middle">Evaluation report</text>
<text x="1030" y="220" class="label" text-anchor="middle">Evidence and uncertainty</text>
<text x="1030" y="250" class="label" text-anchor="middle">Risks in the use case</text>
<text x="1030" y="280" class="small" text-anchor="middle">Human review and refinement</text>
<path d="M1030 145V95H175V143" class="navy"/>
<rect x="420" y="78" width="280" height="27" fill="#fff"/>
<text x="560" y="98" class="label" text-anchor="middle">Evidence for expert review</text>
<rect x="40" y="460" width="270" height="170" rx="15" fill="#edf3f9" stroke="#235480" stroke-width="1.8"/>
<text x="175" y="497" class="heading" text-anchor="middle">Scenario generation</text>
<text x="175" y="531" class="label" text-anchor="middle">Restricted-world model</text>
<text x="175" y="561" class="label" text-anchor="middle">Simulated users and dialogue</text>
<text x="175" y="593" class="small" text-anchor="middle">Typical, rare, and adversarial cases</text>
<path d="M500 316V370H175V458" class="teal"/>
<text x="340" y="356" class="label" text-anchor="middle">Guide the next scenarios</text>
<rect x="440" y="460" width="340" height="170" rx="15" fill="#f5f8fc" stroke="#235480" stroke-width="1.8"/>
<text x="610" y="500" class="heading" text-anchor="middle">AI system under evaluation</text>
<text x="610" y="535" class="label" text-anchor="middle">Conversation and language tasks</text>
<text x="610" y="568" class="label" text-anchor="middle">Responses and behavior</text>
<text x="610" y="600" class="small" text-anchor="middle">Compare models and use cases</text>
<path d="M310 540H438" class="navy"/>
<text x="375" y="521" class="small" text-anchor="middle">Test cases</text>
<rect x="900" y="460" width="260" height="170" rx="15" fill="#fff8eb" stroke="#bb7d1f" stroke-width="1.8"/>
<text x="1030" y="499" class="heading" text-anchor="middle">Risk assessment</text>
<text x="1030" y="533" class="label" text-anchor="middle">Failures and consequences</text>
<text x="1030" y="564" class="label" text-anchor="middle">Safety, fairness, reliability</text>
<text x="1030" y="597" class="small" text-anchor="middle">Validate against expert judgments</text>
<path d="M780 540H898" class="navy"/>
<text x="840" y="521" class="small" text-anchor="middle">Observations</text>
<path d="M1030 460V317" class="navy"/>
<text x="1047" y="401" class="small">Report</text>
<path d="M940 460V370H710V317" class="teal"/>
<text x="835" y="355" class="label" text-anchor="middle">Refine evaluation</text>
<text x="600" y="697" class="heading" text-anchor="middle">Which next test or expert query is most informative?</text>
<text x="600" y="733" class="label" text-anchor="middle">Realistic scenarios · Human requirements · Risk evidence · Evaluation cost</text>
<text x="600" y="765" class="small" text-anchor="middle">REGARD research framework</text>
</svg>
